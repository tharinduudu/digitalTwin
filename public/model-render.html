<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detector CAD render</title><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><style>html,body,#render{margin:0;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}#status{position:absolute;top:12px;left:12px}</style></head><body><div id="render"></div><span id="status">Loading source CAD</span><script type="module">
import {TelescopeScene} from './scene.js';
import {applyStudioAppearance} from './studio-appearance.js';
const view=new TelescopeScene(document.querySelector('#render'));
applyStudioAppearance(view);view.paused=true;view.setCutaway(false);
await view.ready;
if(view.loadError||view.hardware.state.error)throw view.loadError||new Error(view.hardware.state.error);
view.scene.getObjectByName('Centimetre rulers')?.removeFromParent();

view.renderer.render(view.scene,view.camera);document.querySelector('#status').hidden=true;document.querySelector('#render').dataset.ready='true';
</script></body></html>
